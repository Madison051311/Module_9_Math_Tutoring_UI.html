<script>
const examples=[
 {id:1,title:'Constant forcing',tag:'MODULE EXAMPLE',equation:'y″ + 3y′ + 2y = 6',summary:'Constant right-hand side',steps:[
  'm² + 3m + 2 = 0  →  (m + 1)(m + 2) = 0',
  'y<sub>c</sub> = c<sub>1</sub>e<sup>−x</sup> + c<sub>2</sub>e<sup>−2x</sup>',
  'y<sub>p</sub> = A; &nbsp; 2A = 6  →  A = 3',
  '<span class="answer">y = c<sub>1</sub>e<sup>−x</sup> + c<sub>2</sub>e<sup>−2x</sup> + 3</span>'
 ]},
 {id:2,title:'Linear forcing',tag:'MODULE EXAMPLE',equation:'y″ + y′ − 6y = 2x',summary:'Linear polynomial right-hand side',steps:[
  'm² + m − 6 = 0  →  (m + 3)(m − 2) = 0',
  'y<sub>c</sub> = c<sub>1</sub>e<sup>−3x</sup> + c<sub>2</sub>e<sup>2x</sup>',
  'y<sub>p</sub> = Ax + B; &nbsp; −6A = 2; &nbsp; A − 6B = 0',
  'A = −1/3; &nbsp; B = −1/18',
  '<span class="answer">y = c<sub>1</sub>e<sup>−3x</sup> + c<sub>2</sub>e<sup>2x</sup> − x/3 − 1/18</span>'
 ]},
 {id:3,title:'Exponential resonance',tag:'MODULE EXAMPLE',equation:'y″ − 2y′ + y = eˣ',summary:'Repeated characteristic root',steps:[
  'm² − 2m + 1 = 0  →  (m − 1)² = 0',
  'y<sub>c</sub> = c<sub>1</sub>eˣ + c<sub>2</sub>xeˣ',
  'y<sub>p</sub> = Ax²eˣ',
  '2Aeˣ = eˣ  →  A = 1/2',
  '<span class="answer">y = c<sub>1</sub>eˣ + c<sub>2</sub>xeˣ + (1/2)x²eˣ</span>'
 ]},
 {id:4,title:'Mixed forcing + initial values',tag:'MODULE EXAMPLE',equation:'y″ + y = 4x + 10 sin x',summary:'Polynomial and resonant trigonometric forcing',steps:[
  'm² + 1 = 0  →  m = ±i',
  'y<sub>c</sub> = c<sub>1</sub> cos x + c<sub>2</sub> sin x',
  'y<sub>p</sub> = Ax + B + x(C cos x + D sin x)',
  'y<sub>p</sub>″ + y<sub>p</sub> = Ax + B + 2D cos x − 2C sin x',
  'A = 4, &nbsp; B = 0, &nbsp; C = −5, &nbsp; D = 0',
  'y = c<sub>1</sub> cos x + c<sub>2</sub> sin x + 4x − 5x cos x',
  'y(π)=0  →  c<sub>1</sub>=9π; &nbsp; y′(π)=2  →  c<sub>2</sub>=7',
  '<span class="answer">y = 9π cos x + 7 sin x + 4x − 5x cos x</span>'
 ]},
 {id:5,title:'Nonresonant exponential',tag:'EXTRA EXAMPLE',equation:'y″ − y′ − 2y = 3e³ˣ',summary:'Exponential forcing without overlap',steps:[
  'm² − m − 2 = 0  →  (m − 2)(m + 1) = 0',
  'y<sub>c</sub> = c<sub>1</sub>e<sup>2x</sup> + c<sub>2</sub>e<sup>−x</sup>',
  'y<sub>p</sub> = Ae<sup>3x</sup>; &nbsp; (9 − 3 − 2)A = 3  →  A = 3/4',
  '<span class="answer">y = c<sub>1</sub>e<sup>2x</sup> + c<sub>2</sub>e<sup>−x</sup> + (3/4)e<sup>3x</sup></span>'
 ]},
 {id:6,title:'Quadratic polynomial forcing',tag:'EXTRA EXAMPLE',equation:'y″ + 4y = x²',summary:'Match x², x, and constant terms',steps:[
  'm² + 4 = 0  →  m = ±2i',
  'y<sub>c</sub> = c<sub>1</sub> cos 2x + c<sub>2</sub> sin 2x',
  'y<sub>p</sub> = Ax² + Bx + C; &nbsp; y<sub>p</sub>′=2Ax+B; &nbsp; y<sub>p</sub>″=2A',
  '2A + 4(Ax² + Bx + C) = x²',
  '4A=1; &nbsp; 4B=0; &nbsp; 2A+4C=0',
  'A=1/4; &nbsp; B=0; &nbsp; C=−1/8',
  '<span class="answer">y = c<sub>1</sub> cos 2x + c<sub>2</sub> sin 2x + x²/4 − 1/8</span>'
 ]},
 {id:7,title:'Exponential-trigonometric resonance',tag:'EXTRA EXAMPLE',equation:'y″ − 2y′ + 2y = eˣ cos x',summary:'Combined exponential and trigonometric resonance',steps:[
  'm² − 2m + 2 = 0  →  m = 1 ± i',
  'y<sub>c</sub> = eˣ(c<sub>1</sub> cos x + c<sub>2</sub> sin x)',
  'y<sub>p</sub> = xeˣ(A cos x + B sin x)',
  'Let y=eˣu: &nbsp; y″−2y′+2y=eˣ(u″+u)',
  'u=x(A cos x+B sin x)  →  u″+u=2B cos x−2A sin x',
  '2B=1; &nbsp; −2A=0  →  A=0, B=1/2',
  '<span class="answer">y=eˣ(c<sub>1</sub>cos x+c<sub>2</sub>sin x)+(x/2)eˣsin x</span>'
 ]}
];

 {n:1,q:'y″ − y′ = −3'},
 {n:2,q:'(D² + 3D + 2)y = 12x²'},
 {n:3,q:'y″ − 3y′ − 4y = 30e⁴ˣ'},

];
const answers=[
 {n:1,lines:['m(m−1)=0','y<sub>c</sub>=c<sub>1</sub>+c<sub>2</sub>eˣ','y<sub>p</sub>=Ax; &nbsp; −A=−3  →  A=3','<span class="answer">y=c<sub>1</sub>+c<sub>2</sub>eˣ+3x</span>']},
 {n:2,lines:['m²+3m+2=0  →  m=−1,−2','y<sub>c</sub>=c<sub>1</sub>e<sup>−x</sup>+c<sub>2</sub>e<sup>−2x</sup>','y<sub>p</sub>=Ax²+Bx+C','2A=12; &nbsp; 6A+2B=0; &nbsp; 2A+3B+2C=0','A=6; &nbsp; B=−18; &nbsp; C=21','<span class="answer">y=y<sub>c</sub>+6x²−18x+21</span>']},
 {n:3,lines:['m²−3m−4=0  →  m=4,−1','y<sub>c</sub>=c<sub>1</sub>e<sup>4x</sup>+c<sub>2</sub>e<sup>−x</sup>','y<sub>p</sub>=Axe<sup>4x</sup>; &nbsp; 5A=30  →  A=6','<span class="answer">y=c<sub>1</sub>e<sup>4x</sup>+c<sub>2</sub>e<sup>−x</sup>+6xe<sup>4x</sup></span>']},
 {n:4,lines:['m²+1=0  →  m=±i','y<sub>c</sub>=c<sub>1</sub>cos x+c<sub>2</sub>sin x','y<sub>p</sub>=x(A cos x+B sin x)','2B=1; &nbsp; −2A=0  →  A=0, B=1/2','<span class="answer">y=c<sub>1</sub>cos x+c<sub>2</sub>sin x+(x/2)sin x</span>']},
 {n:5,lines:['m²+4m+5=0  →  m=−2±i','x(t)=e<sup>−2t</sup>(C cos t+D sin t)+2','x(0)=0  →  C=−2','x′(0)=−2C+D=0  →  D=−4','<span class="answer">x(t)=2−2e<sup>−2t</sup>cos t−4e<sup>−2t</sup>sin t</span>']}

function goExample(id){currentExample=id;setPage('examples');}
function mathCard(lines){return `<div class="math-card">${lines.map(x=>`<span class="math-line">${x}</span>`).join('')}</div>`;}
function home(){return `<div class="eyebrow">Interactive lesson • Module 09</div><section class="hero"><div><div class="pill">DIFFERENTIAL EQUATIONS</div><h1>The Method of<br>Undetermined Coefficients</h1><p>Choose a trial particular solution, check for overlap, solve its coefficients, then combine it with the complementary solution.</p><div class="button-row"><button class="btn primary" onclick="setPage('concepts')">Start lesson <span aria-hidden="true">→</span></button><button class="btn soft" onclick="setPage('examples')">Open solved examples</button></div></div><div class="hero-visual"><div class="formula">L[y] = g(x)<small>the forcing term determines the trial form</small><br>y = y<sub>c</sub> + y<sub>p</sub></div><div class="axis"><svg class="curve" viewBox="0 0 300 90" preserveAspectRatio="none" aria-label="Illustrative forcing curve"><path d="M0 45 C35 10,70 12,105 45 S175 80,210 45 S265 12,300 45" fill="none" stroke="#287448" stroke-width="3"/></svg></div><div class="pill">y<sub>c</sub> + y<sub>p</sub> • GENERAL SOLUTION</div></div></section><div class="stats"><div class="stat"><div class="stat-icon">ƒ</div><div><strong>7</strong><span>solved examples</span></div></div><div class="stat"><div class="stat-icon">✎</div><div><strong>5</strong><span>practice problems</span></div></div><div class="stat"><div class="stat-icon">↗</div><div><strong>${completed.size}/7</strong><span>examples completed</span></div></div></div><div class="section-head"><div><h2>Continue learning</h2><p>Pick a section and jump straight in.</p></div></div><div class="grid"><article class="tile" onclick="setPage('concepts')"><div class="tile-top"><span class="pill">01 • CONCEPTS</span><span class="tile-arrow">→</span></div><h3>Review the structure</h3><p>yc + yp, trial forms, and the overlap rule.</p></article><article class="tile" onclick="setPage('examples')"><div class="tile-top"><span class="pill">02 • SOLVE</span><span class="tile-arrow">→</span></div><h3>Work through examples</h3><p>Four module examples and three extensions.</p></article><article class="tile" onclick="setPage('practice')"><div class="tile-top"><span class="pill">03 • PRACTICE</span><span class="tile-arrow">→</span></div><h3>Try the five problems</h3><p>Attempt each problem, then reveal its answer.</p></article></div><div class="source-callout"><strong>Source note:</strong> The scan has a stray “Evaluate (transform of 1)” title on page 1 and varies between f(x) and g(x). The worked examples follow the module; missing final lines are supplied.</div>`;}
function concepts(){return `<div class="eyebrow">Reference • Lesson notes</div><h1 class="page-title">Core concepts</h1><p class="page-sub">The compact rules used in every worked example.</p><div class="content-grid"><div class="main-col"><div class="card"><div class="step-label">GENERAL SOLUTION</div>${mathCard(['y = y<sub>c</sub> + y<sub>p</sub>','L[y<sub>c</sub>] = 0','L[y<sub>p</sub>] = g(x)'])}</div><div class="section-head"><div><h2>Trial-form reference</h2><p>Match the forcing family, then check for overlap with yc.</p></div></div><div class="table-wrap"><table class="ref-table"><thead><tr><th>Forcing g(x)</th><th>Trial yp</th><th>Overlap adjustment</th></tr></thead><tbody><tr><td>Constant K</td><td><code>A</code></td><td>multiply by x<sup>s</sup></td></tr><tr><td>Polynomial P<sub>n</sub>(x)</td><td><code>A<sub>n</sub>x<sup>n</sup> + … + A<sub>0</sub></code></td><td>multiply whole trial by x<sup>s</sup></td></tr><tr><td>e<sup>ax</sup></td><td><code>Ae<sup>ax</sup></code></td><td>multiply by x<sup>s</sup></td></tr><tr><td>sin bx or cos bx</td><td><code>A cos bx + B sin bx</code></td><td>multiply by x<sup>s</sup></td></tr><tr><td>e<sup>ax</sup>P<sub>n</sub>(x)</td><td><code>e<sup>ax</sup>(polynomial degree n)</code></td><td>multiply by x<sup>s</sup></td></tr><tr><td>e<sup>ax</sup>sin bx or cos bx</td><td><code>e<sup>ax</sup>(A cos bx+B sin bx)</code></td><td>multiply by x<sup>s</sup></td></tr></tbody></table></div><div class="section-head"><div><h2>Five-part solving pattern</h2></div></div><div class="card">${mathCard(['1. Solve L[y]=0 for y<sub>c</sub>.','2. Identify the forcing family g(x).','3. Choose a trial form y<sub>p</sub>.','4. If it overlaps y<sub>c</sub>, multiply by x until independent.','5. Substitute, solve coefficients, combine; apply initial conditions.'])}</div></div><aside class="right-col"><div class="note-card"><h3>Overlap rule</h3><p>If the assumed trial appears in yc, multiply it by x. For a repeated characteristic root, continue with x², x³, and so on until it is independent.</p></div><div class="note-card"><h3>Example</h3>${mathCard(['(D−1)²y=eˣ','y<sub>c</sub>=c₁eˣ+c₂xeˣ','y<sub>p</sub>=A x²eˣ'])}</div><button class="btn primary" onclick="setPage('examples')">Go to solved examples →</button></aside></div>`;}
function examplesView(){const ex=examples.find(e=>e.id===currentExample)||examples[0];return `<div class="eyebrow">Solve • Worked examples</div><div class="example-title-row"><div><h1 class="page-title">Solved examples</h1><p class="page-sub" style="margin-bottom:0">Module examples plus three extra patterns.</p></div><span class="pill">${ex.tag}</span></div><div class="example-tabs">${examples.map(e=>`<button class="example-tab ${e.id===ex.id?'active':''}" onclick="goExample(${e.id})">Example ${e.id}</button>`).join('')}</div><div class="content-grid"><div class="main-col"><section class="card"><div class="step-label">EXAMPLE ${String(ex.id).padStart(2,'0')} • ${ex.summary.toUpperCase()}</div><div class="math-card" style="font-size:20px;font-weight:700">${ex.equation}</div>${mathCard(ex.steps)}<div class="button-row"><button class="btn soft" onclick="completeExample(${ex.id})">${completed.has(ex.id)?'✓ Completed':'Mark complete'}</button><button class="btn" onclick="goExample(${ex.id===1?7:ex.id-1})">← Previous</button><button class="btn" onclick="goExample(${ex.id===7?1:ex.id+1})">Next →</button></div></section></div><aside class="right-col"><div class="note-card"><h3>Example library</h3><ul>${examples.map(e=>`<li><a href="#" onclick="goExample(${e.id});return false" style="color:${e.id===ex.id?'#17472f':'#667a6c'};font-weight:${e.id===ex.id?'800':'500'}">${e.id}. ${e.title}</a></li>`).join('')}</ul></div><div class="note-card"><h3>Source labels</h3><p>Examples 1–4 are from Module 9. Examples 5–7 are additional practice examples.</p></div></aside></div>`;}
function practiceView(){return `<div class="eyebrow">Practice • Try This</div><h1 class="page-title">Try This</h1><p class="page-sub">Solve the five equations first. Reveal each result when you’re ready.</p><div class="grid" style="grid-template-columns:1fr 1fr">${practices.map(p=>`<article class="card problem"><div class="problem-num">${p.n}</div><div><h3>Problem ${p.n}</h3><p class="math-card" style="margin:8px 0;font-size:16px">${p.q}</p></div><button class="btn soft" onclick="toggleAnswer(${p.n})" id="reveal-${p.n}">Reveal answer</button><div class="answer-box" id="answer-${p.n}" hidden>${mathCard(answers[p.n-1].lines)}</div></article>`).join('')}</div><div class="source-callout">Try matching the forcing term to a trial form before differentiating.</div>`;}
function answersView(){return `<div class="eyebrow">Practice • Answer key</div><h1 class="page-title">Answer key</h1><p class="page-sub">Mathematical solutions to the five module exercises.</p>${answers.map(a=>`<section class="card key-card"><div class="problem"><div class="problem-num">${a.n}</div><div><h3>Try This ${a.n}</h3><p class="math-card" style="margin:7px 0 0;font-size:16px">${practices[a.n-1].q}</p></div><span class="status">SOLUTION</span><div class="answer-box">${mathCard(a.lines)}</div></div></section>`).join('')}`;}
function render(){const templates={home,concepts,examples:examplesView,practice:practiceView,answers:answersView};view.innerHTML=templates[currentPage]();}
function completeExample(id){completed.add(id);localStorage.setItem('m9-completed',JSON.stringify([...completed]));progress();render();}
function toggleAnswer(n){const box=document.getElementById(`answer-${n}`);box.hidden=!box.hidden;document.getElementById(`reveal-${n}`).textContent=box.hidden?'Reveal answer':'Hide answer';}
document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('searchBox').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim().toLowerCase();const hit=examples.find(x=>x.title.toLowerCase().includes(q)||x.equation.toLowerCase().includes(q)||String(x.id)===q);if(hit){currentExample=hit.id;setPage('examples')}else if(q.includes('try')||q.includes('practice'))setPage('practice')}});
progress();render();
</script>
</body>
</html>
